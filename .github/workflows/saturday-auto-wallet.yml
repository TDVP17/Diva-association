name: Daily J-1 Auto-Wallet Contributions & Loan Checks

on:
  schedule:
    # Every day at 07:00 UTC = 08:00 Cameroon time (Africa/Douala UTC+1)
    # Automatically pays J-1 cotisations from wallet + runs Day-20 loan reminders & overdue penalties
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  run-crons:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Daily J-1 08:00 Auto-Wallet Contributions
        run: |
          curl -sf -X POST "https://divaasso.com/api/crons/auto-wallet-contributions" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" || true

      - name: Trigger Daily Loan Day-20 Reminders & Overdue Penalties
        run: |
          curl -sf -X POST "https://divaasso.com/api/crons/loan-penalties" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" || true
