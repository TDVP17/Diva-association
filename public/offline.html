<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#003528" />
    <title>Offline — DIVA Association</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #003528;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 24px;
        text-align: center;
      }
      img { width: 88px; height: 88px; border-radius: 20px; }
      h1 { font-size: 20px; margin: 0; }
      p { font-size: 15px; color: rgba(255, 255, 255, 0.75); margin: 0; max-width: 320px; line-height: 1.5; }
      button {
        margin-top: 8px;
        padding: 12px 24px;
        border-radius: 12px;
        border: none;
        background: #f0b429;
        color: #003528;
        font-weight: 600;
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <img src="/icons/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>
      This page hasn't been viewed yet, so it isn't available offline. Reconnect to load it — pages you've already
      visited (like your dashboard, contributions, and history) still work without a connection.
    </p>
    <button onclick="location.reload()">Try again</button>
  </body>
</html>
